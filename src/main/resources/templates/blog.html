<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ブログアプリ</title>
</head>

<body>

    <h1>ブログ一覧</h1>
    <div th:each="blog : ${blogList}">
        <h3 th:text="${blog.title}">ブログのタイトル</h3>
        <p th:text="${blog.content}">ブログの本文が入ります。</p>
        <p>
            <small>投稿日時: <span th:text="${blog.createdAt}">2026-01-01T00:00:00</span></small>
            <small>（ユーザーID: <span th:text="${blog.userId}">1</span>）</small>
        </p>
        <hr>
    </div>

    <h2>新規ブログ投稿</h2>
    <form th:action="@{/blog/post}" method="post">
        <div>
            <label for="title">タイトル：</label><br>
            <input type="text" id="title" name="title" required maxlength="100">
        </div>
        <br>
        <div>
            <label for="content">内容：</label><br>
            <textarea id="content" name="content" rows="5" cols="40" required></textarea>
        </div>
        <br>
        <button type="submit">投稿する</button>
    </form>

    <br>
    <a th:href="@{/login}">ログイン画面へ</a>

</body>

</html>
